name: Build Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'src/nyx/**'
      - 'tests/vetting/oracle_coverage.csv'
      - '.readthedocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'src/nyx/**'
      - 'tests/vetting/oracle_coverage.csv'
      - '.readthedocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  Build_Docs:
    name: Build documentation (warnings are errors)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install documentation dependencies
      run: python -m pip install -r docs/requirements.txt

    - name: Check the command-line reference against the CLI
      run: python docs/tools/gen_cli_reference.py --check

    - name: Check the feature reference against the code
      run: python docs/tools/gen_feature_reference.py --check

    - name: Build HTML
      run: python -m sphinx -b html -W --keep-going docs/source docs/build/html

  # External sites rate-limit and time out from CI runners now and then, so a broken link is
  # reported here without failing the workflow.
  Check_Links:
    name: Check external links (does not block)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install documentation dependencies
      run: python -m pip install -r docs/requirements.txt

    - name: Check links
      run: python -m sphinx -b linkcheck -W --keep-going docs/source docs/build/linkcheck
