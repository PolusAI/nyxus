[[option]]
name = "--coarseGrayDepth"
group = "Texture settings"
required = false
default = "64"
default_at = "environment.cpp:coarse_grayscale_depth"
values = "integer: > 0 MATLAB-style bins from 0 to the ROI maximum, < 0 |n| PyRadiomics-style bins over the ROI range, 0 no binning"
build = ""
summary = "Grey depth used to bin intensities for every 2D and 3D texture family, and the bin count of the ENTROPY, UNIFORMITY and HISTOGRAM histograms and of the Intensity Histogram (IH_*) family."
notes = "A family's own greydepth metaparameter (set_metaparam in Python) overrides it for that family. NGLDM bins a positive value its own way, to levels 0 to n. The histograms use |n| bins, and 24 at 0; HISTOGRAM writes one column per bin, and the IH_* features return the --noval substitute with a single bin. --ibsi=true makes every texture family skip binning, except the 2D GLCM test for a constant ROI. A value that is not an integer, or whose magnitude is past 2147483647, stops the run with an error."
evidence = "environment.cpp:106, 664-679; env_features.cpp:726, 736, 741-744; helpers/helpers.h:129; features/texture_feature.h:79-99, 141-157; constants.h:10-15; features/intensity_histogram.cpp:311"

