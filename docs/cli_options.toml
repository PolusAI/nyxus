[[option]]
name = "--features"
group = "Features"
required = false
default = "*ALL* (2D) or *3D_ALL* (3D)"
values = "comma-separated feature and group names (case-insensitive), or the path of a text file listing them"
build = ""
summary = "Selects the features or feature groups to compute."
notes = "If omitted, *ALL* (2D) or *3D_ALL* (3D) is computed; in 2D the IH_* features are then left out unless --ibsi=true. If the value is the path of an existing file, the names are read from it: one or more per line, and `#` starts a comment. Names are case-insensitive. An unknown name stops the run and lists the valid names. Image-quality names cannot be mixed with other features. Intensity Histogram (IH_*) features need --ibsi=true."
evidence = "environment.cpp:587-594, 845-907; env_features.cpp:71-182, 459-529; featureset.cpp:650, 940"

