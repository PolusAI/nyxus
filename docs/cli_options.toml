[[option]]
name = "--intDir"
group = "Input"
required = true
default = ""
values = "path to an existing directory"
build = ""
summary = "Directory holding the intensity images."
notes = "Required even when --intSegMapFile is used: mapped intensity file names are resolved relative to this directory. When it is the same directory as --segDir, Nyxus runs in whole-slide mode and treats each image as one ROI."
evidence = "environment.cpp:563-567, 575-578; dirs_and_files.cpp:65-66, 135"

[[option]]
name = "--segDir"
group = "Input"
required = true
default = ""
values = "path to an existing directory"
build = ""
summary = "Directory holding the label (mask) images that define the ROIs."
notes = "Set it to the same directory as --intDir for whole-slide mode, where each intensity image is a single ROI and no mask is read. Required even with --intSegMapFile: mapped mask file names are resolved relative to this directory."
evidence = "environment.cpp:558-562, 575-578; main_nyxus.cpp:83-91, 147-168; dirs_and_files.cpp:74-91, 139"

[[option]]
name = "--filePattern"
group = "Input"
required = false
default = ".*"
default_at = "environment_basic.h:rawFilePattern"
values = "regular expression (2D); regular expression or file pattern with `{d+}`, `{c+}`, `{set d+}` (3D)"
build = ""
summary = "Selects which files in the input directories are processed. In 2D the pattern must match the whole file name."
notes = "A regular expression, so use `.*\\.tif` rather than `*.tif`. In 3D a pattern containing `{set d+}` is read as a z-slice file pattern, for example `BRATS_{d+}_z{set d+}_t{d+}.ome.tif`. Such a pattern currently matches no files and the run stops with 'No intensity and/or label file pairs to process'. Not applied to pairs listed in an --intSegMapFile."
evidence = "environment_basic.h:27; environment.cpp:345-346, 519-523, 538-554; environment_basic.cpp:19-55; strpat.cpp:9-35; dirs_and_files.cpp:28-46"

[[option]]
name = "--intSegMapFile"
group = "Input"
required = false
default = ""
values = "file name inside --intSegMapDir"
