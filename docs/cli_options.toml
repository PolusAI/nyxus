summary = "Names a text file that lists explicit intensity/mask pairs, one pair per line, instead of matching files by name."
notes = "Each line holds an intensity file name and then a mask file name, separated by whitespace. Intensity names are relative to --intDir and mask names to --segDir. Requires --intSegMapDir. --filePattern is not applied to listed pairs. 2D only."
