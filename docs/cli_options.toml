[[option]]
name = "--aggr"
group = "Output"
required = false
default = "false"
default_at = "cli_result_options.h:need_aggregation_"
values = "true | false | t | f (case-insensitive)"
build = ""
summary = "When true, writes one row per image holding the mean of each feature over that image's ROIs, labelled ROI -1, instead of one row per ROI."
notes = "Applies only to CSV output (separatecsv or singlecsv) for images with masks. Arrow, Parquet and whole-slide output ignore it. Values the features substituted with --noval enter the mean at that value. A value still NaN at output time contributes the full --noval rather than --noval divided by the number of ROIs, and an infinite value is not replaced, so the aggregated cell can be inf."
evidence = "cli_result_options.h:46-52, 77; output_2_csv.cpp:505-557; workflow_2d_segmented.cpp:334-336; workflow_3d_segmented.cpp:261-263"

