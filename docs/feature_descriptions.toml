# One-line descriptions of every feature code, by family, and a note per family. Rendered
# into docs/source/featurelist.rst by docs/tools/gen_feature_reference.py, which fails on a
# code with no entry and on an entry that names no code. Each description states what the
# code computes; it was checked against the source when written.

[family_notes]
intensity = "Statistics of the intensities of the ROI's pixels. They are reported in the image's own units; see Intensity units and CT images in the supported formats page."
intensity_histogram = "Available only in IBSI mode (--ibsi=true). All features come from one histogram per ROI with --coarseGrayDepth equal-width bins over the ROI's intensity range."
neighbors = "Two ROIs are neighbours when their contours come within --pixelDistance pixels of each other (5 by default), measured between contour pixels, not centroids."
glcm = "The grey-level co-occurrence matrix counts pairs of ROI pixels one pixel apart, built separately for each angle in --glcmAngles (default 0, 45, 90 and 135 degrees); pairs with a pixel of stored intensity 0 are skipped, which covers every pixel outside the ROI and any ROI pixel whose value is 0. Each plain code is output as one column per angle, named with the angle as a suffix (for example GLCM_ASM_45), and its _AVE code is the mean of those columns. Grey levels come from --coarseGrayDepth binning or are the raw intensities under --ibsi; each ordered pair is counted once with a positive grey depth, and the matrix is made symmetric with a negative or zero grey depth and under --ibsi."
glrlm = "A run is a straight line of consecutive pixels with the same grey level; runs are collected separately along 0, 45, 90 and 135 degrees into a grey level by run length matrix. Each plain code is output as one column per angle (suffixes _0, _45, _90 and _135), and its _AVE code is the mean of the four. Grey levels come from --coarseGrayDepth binning, or are the raw intensities under --ibsi. With a positive --coarseGrayDepth (the default), pixels of stored intensity 0, including every bounding-box pixel outside the ROI, are binned to grey level 1 and form runs; under --ibsi or a negative --coarseGrayDepth they are skipped."
glszm = "A zone is a group of connected pixels sharing one grey level, grown from each unvisited pixel in scan order through same-level neighbours to its east, south-east, south and south-west; the matrix counts zones by grey level and size. The family has no directions, so each code is one value per ROI. Grey levels come from --coarseGrayDepth binning, or are the raw intensities under --ibsi. With a positive --coarseGrayDepth (the default), pixels of stored intensity 0, including every bounding-box pixel outside the ROI, are binned to grey level 1 and form zones; under --ibsi or a negative --coarseGrayDepth they are skipped."
gldm = "A pixel's dependence is one plus the number of its 8 neighbours of nonzero stored intensity that have exactly the same grey level, and the matrix counts the ROI pixels of nonzero stored intensity by grey level and dependence. The family has no directions, so each code is one value per ROI. Grey levels come from --coarseGrayDepth binning, or are the raw intensities under --ibsi."
gldzm = "A zone is an 8-connected group of pixels sharing one grey level. Its distance is the smallest, over its pixels, of the steps along a row or column to the nearest pixel of stored intensity 0 plus one, or to the bounding-box edge, where a pixel on the bounding-box edge is at distance 1. With a positive --coarseGrayDepth (the default) the pixels outside the ROI are binned to grey level 1 and form zones like ROI pixels, so only the bounding-box edge counts; under --ibsi pixels of stored intensity 0 are skipped. The matrix counts zones by grey level and distance; each code is one value per ROI. Grey levels come from --coarseGrayDepth binning, or are the raw intensities under --ibsi."
ngldm = "Every ROI pixel is a neighbourhood centre whose dependence count is one plus the number of its 8 neighbours inside the ROI with the same grey level; the matrix counts centres by grey level and dependence count. Each code is one value per ROI. Grey levels come from scaling the range 0 to the ROI maximum by --coarseGrayDepth and truncating (levels 0 to --coarseGrayDepth), or are the raw intensities under --ibsi."
ngtdm = "For each pixel of nonzero binned grey level that has at least one such neighbour, the matrix accumulates the absolute difference between its grey level and the average grey level of its 8 neighbours (neighbours whose binned grey level is 0 are left out), grouped by grey level, together with the probability of each grey level. Each code is one value per ROI. Grey levels come from --coarseGrayDepth binning, or are the raw intensities under --ibsi. With a positive --coarseGrayDepth (the default), pixels outside the ROI are binned to grey level 1 and take part both as centres and as neighbours."
shape_moments = "Geometric moments of the ROI's shape: every ROI pixel counts as 1. The two digits of a code are the powers of x and y. The weighted moments weight each pixel by ln(d + 0.001), where d is an approximate distance from the pixel to the traced ROI contour (taken one pixel down and to the right of the ROI), found by a sampled search that can overestimate it."
intensity_moments = "The same moments with each pixel weighted by its intensity, in grey levels. The two digits of a code are the powers of x and y. The weighted moments multiply each intensity by ln(d + 0.001), where d is an approximate distance from the pixel to the traced ROI contour (taken one pixel down and to the right of the ROI), found by a sampled search that can overestimate it."
gabor = "GABOR has one output column per frequency and orientation pair, GABOR_0, GABOR_1 and so on."
intensity_3d = "The 3D counterparts of the 2D intensity features, computed over the ROI's voxels and reported in the volume's own units."
glcm_3d = "The co-occurrence matrix counts pairs of voxels one voxel apart within the bounding box, built separately for the 13 unique directions of the 26-voxel neighbourhood; with a positive grey depth (the default) the background around the ROI is binned to level 1 and its pairs are counted, while with a zero or negative grey depth and under --ibsi pairs touching level 0 are skipped. Each _AVE code is the mean over the 13 directions; the plain code is a single value taken from the first direction only (one voxel step along x, y and z together), not an average. Grey levels come from --coarseGrayDepth binning (overridable with the 3glcm/greydepth metaparameter) or are the raw intensities under --ibsi; each ordered pair is counted once with a positive grey depth, and the matrix is made symmetric with a negative or zero grey depth and under --ibsi."
glrlm_3d = "Runs of consecutive voxels with the same grey level are collected separately along the 13 unique directions of the 26-voxel neighbourhood. Each _AVE code is the mean over the 13 directions; the plain code is a single value taken from the first direction only (one voxel step along x, y and z together), not an average. Grey levels are binned to the 3glrlm/greydepth metaparameter, which defaults to 0 (no binning, raw intensities) rather than following --coarseGrayDepth; --ibsi also uses the raw intensities."
glszm_3d = "A zone is a 26-connected group of voxels sharing one grey level, and the matrix counts zones by grey level and size. The family has no directions, so each code is one value per ROI. Grey levels are binned to the 3glszm/greydepth metaparameter, which defaults to 0 (no binning, raw intensities) rather than following --coarseGrayDepth; --ibsi also uses the raw intensities."
gldm_3d = "A voxel's dependence is one plus the number of its 26 neighbours in the bounding box that have exactly the same grey level, and the matrix counts ROI voxels by grey level and dependence. The family has no directions, so each code is one value per ROI. Grey levels are binned to the 3gldm/greydepth metaparameter, which defaults to 0 (no binning, raw intensities) rather than following --coarseGrayDepth; --ibsi also uses the raw intensities."
gldzm_3d = "A zone is a 26-connected group of ROI voxels sharing one grey level, and its distance is the smallest city-block distance of any of its voxels to the nearest voxel outside the ROI, with surface voxels at distance 1. The matrix counts zones by grey level and distance; each code is one value per ROI. Grey levels come from --coarseGrayDepth binning, or are the raw intensities under --ibsi."
ngldm_3d = "Every ROI voxel is a neighbourhood centre whose dependence count is one plus the number of its 26 neighbours inside the ROI with the same grey level; the matrix counts centres by grey level and dependence count. Each code is one value per ROI. Grey levels come from scaling the range 0 to the ROI maximum by --coarseGrayDepth and truncating (levels 0 to --coarseGrayDepth), or are the raw intensities under --ibsi."
ngtdm_3d = "For each ROI voxel the matrix accumulates the absolute difference between its grey level and the average grey level of the ROI voxels within the 3ngtdm/radius Chebyshev distance (default 1, at most 26 neighbours), grouped by grey level, together with the probability of each grey level. Each code is one value per ROI. Grey levels are binned to the 3ngtdm/greydepth metaparameter, which defaults to 0 (no binning, raw intensities) rather than following --coarseGrayDepth; --ibsi also uses the raw intensities. Voxels of the bounding box outside the mask are neither centres nor neighbours, in every mode, and a ROI voxel with no ROI neighbour is left out."
image_quality = "2D features computed on each ROI's bounding box with pixels outside the ROI set to 0."

[intensity]
COV = "Coefficient of variation: the unbiased (n-1) standard deviation of the ROI's pixel intensities divided by their mean; 0 when the mean is 0."
COVERED_IMAGE_INTENSITY_RANGE = "Ratio of the ROI's intensity range (MAX minus MIN) to the intensity range of the pixels of all ROIs in the image; pixels outside every ROI are not used."
ENERGY = "Sum of the squared pixel intensities of the ROI."
ENTROPY = "Shannon entropy (base 2) of the ROI's intensity histogram, binned into |--coarseGrayDepth| equal-width bins (default 64) spanning the ROI's minimum to maximum intensity."
EXCESS_KURTOSIS = "Excess kurtosis of the ROI's pixel intensities: the population fourth standardized moment minus 3; 0 for ROIs with fewer than 5 pixels or a single intensity."
HYPERFLATNESS = "Sixth standardized moment of the ROI's pixel intensities: the mean sixth power of the deviations from the mean, divided by the sixth power of the unbiased (n-1) standard deviation."
HYPERSKEWNESS = "Fifth standardized moment of the ROI's pixel intensities: the mean fifth power of the deviations from the mean, divided by the fifth power of the unbiased (n-1) standard deviation."
INTEGRATED_INTENSITY = "Sum of the pixel intensities of the ROI."
INTERQUARTILE_RANGE = "Difference between the 75th and 25th percentiles (P75 minus P25) of the ROI's pixel intensities."
KURTOSIS = "Pearson kurtosis of the ROI's pixel intensities: the population fourth standardized moment, without subtracting 3; 0 for ROIs with fewer than 5 pixels or a single intensity."
MAX = "Maximum intensity value in the ROI"
MEAN = "Mean intensity value of the ROI"
MEAN_ABSOLUTE_DEVIATION = "Mean absolute deviation of the ROI's pixel intensities from their mean."
MEDIAN = "Median pixel intensity of the ROI; the average of the two middle values when the pixel count is even."
MEDIAN_ABSOLUTE_DEVIATION = "Mean absolute deviation of the ROI's pixel intensities from their median (differs from the median of the absolute deviations from the median)."
MIN = "Minimum intensity value in the ROI"
MODE = "Most frequent pixel intensity in the ROI; the smallest such intensity when several share the top count."
P01 = "1st percentile of the ROI's pixel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
P10 = "10th percentile of the ROI's pixel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
P25 = "25th percentile (first quartile) of the ROI's pixel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
P75 = "75th percentile (third quartile) of the ROI's pixel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
P90 = "90th percentile of the ROI's pixel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
P99 = "99th percentile of the ROI's pixel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
QCOD = "Quartile coefficient of dispersion: (P75 minus P25) divided by (P75 plus P25); 0 when the denominator is 0."
RANGE = "Difference between the maximum and minimum pixel intensities of the ROI (MAX minus MIN)."
ROBUST_MEAN = "Mean of the ROI's pixel intensities that lie between P10 and P90, inclusive."
ROBUST_MEAN_ABSOLUTE_DEVIATION = "Mean absolute deviation from ROBUST_MEAN of the ROI's pixel intensities that lie between P10 and P90, inclusive."
ROOT_MEAN_SQUARED = "Root mean square of the ROI's pixel intensities: the square root of ENERGY divided by the pixel count."
SKEWNESS = "Skewness of the ROI's pixel intensities: the population third standardized moment; 0 for ROIs with fewer than 4 pixels or a single intensity."
STANDARD_DEVIATION = "Unbiased standard deviation of the ROI's pixel intensities, with n-1 in the denominator."
STANDARD_DEVIATION_BIASED = "Biased (population) standard deviation of the ROI's pixel intensities, with n in the denominator."
STANDARD_ERROR = "Standard error of the mean: the unbiased standard deviation divided by the square root of the pixel count."
VARIANCE = "Unbiased variance of the ROI's pixel intensities, with n-1 in the denominator."
VARIANCE_BIASED = "Biased (population) variance of the ROI's pixel intensities, with n in the denominator."
UNIFORMITY = "Sum of the squared bin probabilities of the ROI's intensity histogram, binned into |--coarseGrayDepth| equal-width bins (default 64) spanning the ROI's minimum to maximum intensity."
UNIFORMITY_PIU = "Percent image uniformity: (1 minus (MAX minus MIN) divided by (MAX plus MIN)) times 100; 0 when MAX plus MIN is 0."
HISTOGRAM = "Multi-column feature HISTOGRAM_BIN_0 to HISTOGRAM_BIN_N-1: the number of ROI pixels in each of N equal-width bins spanning the ROI's minimum to maximum intensity, where N is --coarseGrayDepth (default 64); a negative value writes no columns (a fix is coming). It is not part of *ALL_INTENSITY*; it is computed only together with another intensity feature or with *ALL*, and requested on its own every column is 0 (known defect, https://github.com/PolusAI/nyxus/issues/489)."

[intensity_histogram]
IH_MEAN_VAL = "Mean intensity read from the ROI's N-bin intensity histogram: the frequency-weighted mean of the bin centres. All IH_ features use N equal-width bins over the ROI's intensity range, N = --coarseGrayDepth (default 64), and are computed only in IBSI mode (--ibsi)."
IH_VARIANCE_VAL = "Population variance of the histogram's bin-centre intensities, weighted by bin frequency."
IH_SKEWNESS_VAL = "Skewness (third standardized moment) of the histogram's bin-centre intensities, weighted by bin frequency."
IH_EXCESS_KURTOSIS_VAL = "Excess kurtosis (fourth standardized moment minus 3) of the histogram's bin-centre intensities, weighted by bin frequency."
IH_MEDIAN_VAL = "Centre intensity of the first histogram bin at which the cumulative pixel count exceeds half the ROI's pixel count."
IH_MINIMUM_VAL = "Minimum intensity of the ROI, the lower edge of the histogram's first bin."
IH_P10_VAL = "10th percentile intensity, interpolated linearly within the histogram bin that contains it."
IH_P90_VAL = "90th percentile intensity, interpolated linearly within the histogram bin that contains it."
IH_MAXIMUM_VAL = "Maximum intensity of the ROI, the upper edge of the histogram's last bin."
IH_MODE_VAL = "Centre intensity of the most populated histogram bin; the lowest such bin on ties."
IH_INTERQUANTILE_RANGE_VAL = "Difference between the 75th and 25th percentile intensities, each interpolated within its histogram bin."
IH_RANGE_VAL = "Difference between the ROI's maximum and minimum intensities."
IH_MEAN_ABSOLUTE_DEVIATION_VAL = "Frequency-weighted mean absolute deviation of the histogram's bin-centre intensities from IH_MEAN_VAL."
IH_ROBUST_MEAN_ABSOLUTE_DEVIATION_VAL = "Mean absolute deviation from IH_ROBUST_MEAN_VAL of the bin-centre intensities of the bins from the 10th-percentile bin to the 90th-percentile bin, inclusive."
IH_MEDIAN_ABSOLUTE_DEVIATION_VAL = "Frequency-weighted mean absolute deviation of the histogram's bin-centre intensities from IH_MEDIAN_VAL."
IH_COEFFICIENT_OF_VARIATION_VAL = "Square root of IH_VARIANCE_VAL divided by IH_MEAN_VAL."
IH_QUANTILE_COEFFICIENT_OF_DISPERSION_VAL = "Quartile coefficient of dispersion of the histogram: (P75 minus P25) divided by (P75 plus P25), using the interpolated percentile intensities."
IH_ENTROPY_VAL = "Shannon entropy (base 2) of the histogram's bin probabilities."
IH_UNIFORMITY_VAL = "Sum of the squared bin probabilities of the histogram."
IH_ROBUST_MEAN_VAL = "Frequency-weighted mean of the bin-centre intensities of the bins from the 10th-percentile bin to the 90th-percentile bin, inclusive."
IH_MEAN_IDX = "Frequency-weighted mean of the 1-based histogram bin indices."
IH_VARIANCE_IDX = "Population variance of the histogram bin indices, weighted by bin frequency."
IH_SKEWNESS_IDX = "Skewness (third standardized moment) of the histogram bin indices, weighted by bin frequency."
IH_EXCESS_KURTOSIS_IDX = "Excess kurtosis (fourth standardized moment minus 3) of the histogram bin indices, weighted by bin frequency."
IH_MEDIAN_IDX = "1-based index of the histogram bin that holds IH_MEDIAN_VAL."
IH_MINIMUM_IDX = "1-based index of the histogram bin that holds the ROI's minimum intensity, which is always 1."
IH_P10_IDX = "1-based index of the histogram bin that holds the 10th percentile intensity."
IH_P90_IDX = "1-based index of the histogram bin that holds the 90th percentile intensity."
IH_MAXIMUM_IDX = "1-based index of the histogram bin that holds the ROI's maximum intensity, which is always N."
IH_MODE_IDX = "1-based index of the most populated histogram bin; the lowest such bin on ties."
IH_INTERQUANTILE_RANGE_IDX = "Difference between the bin indices that hold the 75th and 25th percentile intensities."
IH_RANGE_IDX = "Difference between the bin indices that hold the maximum and minimum intensities, which is N minus 1."
IH_MEAN_ABSOLUTE_DEVIATION_IDX = "Frequency-weighted mean absolute deviation of the histogram bin indices from their mean."
IH_ROBUST_MEAN_ABSOLUTE_DEVIATION_IDX = "Mean absolute deviation from the robust mean index of the bin indices from the 10th-percentile bin to the 90th-percentile bin, inclusive."
IH_MEDIAN_ABSOLUTE_DEVIATION_IDX = "Frequency-weighted mean absolute deviation of the histogram bin indices from the median bin index."
IH_COEFFICIENT_OF_VARIATION_IDX = "Square root of IH_VARIANCE_IDX divided by IH_MEAN_IDX."
IH_QUANTILE_COEFFICIENT_OF_DISPERSION_IDX = "Quartile coefficient of dispersion of the bin indices: the difference of the 1-based bin indices holding P75 and P25, divided by their sum."
IH_ENTROPY_IDX = "Shannon entropy (base 2) of the histogram's bin probabilities; equal to IH_ENTROPY_VAL."
IH_UNIFORMITY_IDX = "Sum of the squared bin probabilities of the histogram; equal to IH_UNIFORMITY_VAL."
IH_MAX_GRADIENT = "Largest gradient of the histogram's bin counts, in pixels per bin, using central differences inside and one-sided differences at the first and last bins; when no gradient is above 0 it returns 2.2251e-308 (DBL_MIN) instead."
IH_MAX_GRADIENT_IDX = "1-based index of the first histogram bin at which IH_MAX_GRADIENT occurs; 0 when no gradient is above 0."
IH_MIN_GRADIENT = "Smallest (most negative) gradient of the histogram's bin counts, in pixels per bin, using central differences inside and one-sided differences at the first and last bins."
IH_MIN_GRADIENT_IDX = "1-based index of the histogram bin at which IH_MIN_GRADIENT occurs."
IH_ROBUST_MEAN_IDX = "Frequency-weighted mean of the 1-based bin indices from the 10th-percentile bin to the 90th-percentile bin, inclusive."
IH_NUM_BINS = "Number of histogram bins N, set by --coarseGrayDepth (default 64)."
IH_BIN_SIZE = "Width of one histogram bin in intensity units: the ROI's intensity range divided by N."

[basic_morphology]
AREA_PIXELS_COUNT = "ROI area as the number of pixels in the ROI."
AREA_UM2 = "ROI area in square micrometers, meant as the pixel count times the squared pixel size; currently reported as 0, because the image resolution does not reach this feature (known defect, https://github.com/PolusAI/nyxus/issues/496)."
CENTROID_X = "X coordinate of the ROI's centroid: the mean x coordinate of its pixels, in pixels."
CENTROID_Y = "Y coordinate of the ROI's centroid: the mean y coordinate of its pixels, in pixels."
WEIGHTED_CENTROID_Y = "Y coordinate of the ROI's intensity-weighted centroid: the mean of the pixel y coordinates weighted by pixel intensity; 0 when the ROI's total intensity is 0."
WEIGHTED_CENTROID_X = "X coordinate of the ROI's intensity-weighted centroid: the mean of the pixel x coordinates weighted by pixel intensity; 0 when the ROI's total intensity is 0."
MASS_DISPLACEMENT = "Distance in pixels between the ROI's intensity-weighted centroid and its unweighted centroid."
COMPACTNESS = "Unbiased (n-1) standard deviation of the distances from the ROI's pixels to its centroid, divided by the ROI's pixel count (differs from the mean squared distance to the centroid divided by the area)."
BBOX_YMIN = "Smallest y coordinate (top row) of the ROI's axis-aligned bounding box, in pixels."
BBOX_XMIN = "Smallest x coordinate (leftmost column) of the ROI's axis-aligned bounding box, in pixels."
BBOX_HEIGHT = "Height of the smallest axis-aligned box containing the ROI"
BBOX_WIDTH = "Width of the smallest axis-aligned box containing the ROI"
DIAMETER_EQUAL_AREA = "Diameter of a circle with the same area as the ROI: 2 times the square root of the pixel count divided by pi, in pixels."
EXTENT = "Fraction of the ROI's axis-aligned bounding box covered by the ROI: the pixel count divided by the bounding box area."
ASPECT_RATIO = "Width of the ROI's axis-aligned bounding box divided by its height."

[contour]
PERIMETER = "Length of the ROI's traced contour in pixels: the sum of the Euclidean distances between consecutive contour pixels, closing back to the first one. A hole or a second fragment appends its loop to the same list, and the jumps between loops are counted too. On the out-of-core path it is the number of contour pixels instead."
DIAMETER_EQUAL_PERIMETER = "Diameter of a circle with the same perimeter as the ROI: PERIMETER divided by pi, in pixels."
EDGE_MEAN_INTENSITY = "Mean intensity of ROI's contour pixels"
EDGE_STDDEV_INTENSITY = "Unbiased (n-1) standard deviation of the intensities of the ROI's contour pixels."
EDGE_MAX_INTENSITY = "Maximum intensity of ROI's contour pixels"
EDGE_MIN_INTENSITY = "Minimum intensity of ROI's contour pixels"
EDGE_INTEGRATED_INTENSITY = "Sum of the intensities of the ROI's contour pixels."

[convex_hull]
CIRCULARITY = "Square root of 4 pi times the ROI's pixel count divided by the square of its PERIMETER; close to 1 for a digital disk and smaller for less circular shapes; small or blocky ROIs can exceed 1."
CONVEX_HULL_AREA = "Area of the convex hull of the ROI's pixel centres, in pixels, converted to a pixel-count equivalent with Pick's theorem (polygon area plus half the hull boundary lattice points plus 1)."
SOLIDITY = "ROI's pixel count divided by CONVEX_HULL_AREA."
POLYGONALITY_AVE = "Score of how closely the ROI matches a regular polygon with NUM_NEIGHBORS sides: 10 times the mean of a side-length ratio and an area ratio computed from the ROI's area and PERIMETER. 10 means a perfect match, lower values a poorer one; -1 when the ROI has fewer than 3 neighbors."
HEXAGONALITY_AVE = "Score of how closely the ROI matches a regular hexagon: 10 times the mean of the average pairwise agreement among 11 hexagon area estimates and among 14 hexagon perimeter estimates, built from the area, PERIMETER, convex hull area and minimum and maximum Feret diameters. 10 means a perfect hexagon, lower values a poorer match; -1 when the ROI has fewer than 3 neighbors."
HEXAGONALITY_STDDEV = "Dispersion of the hexagonality estimates: the square root of the mean of the population variances of the pairwise area ratios and of the pairwise perimeter ratios used in HEXAGONALITY_AVE; -1 when the ROI has fewer than 3 neighbors."

[ellipse]
MAJOR_AXIS_LENGTH = "Length (in pixels) of the major axis of the ellipse that has the same normalized second central moments as the region"
MINOR_AXIS_LENGTH = "Length (in pixels) of the minor axis of the ellipse that has the same normalized second central moments as the region"
ELONGATION = "MINOR_AXIS_LENGTH divided by MAJOR_AXIS_LENGTH of the ROI's moment-equivalent ellipse; 1 for a circle."
ECCENTRICITY = "Eccentricity of the ROI's moment-equivalent ellipse: the distance between its foci divided by its major axis length, from 0 for a circle toward 1 for a line."
ORIENTATION = "Angle in degrees, from -90 to 90, between the x axis and the major axis of the ROI's moment-equivalent ellipse, measured in image coordinates with y increasing downward."
ROUNDNESS = "4 times the ROI's area divided by pi times the square of MAJOR_AXIS_LENGTH; 1 for a circle."

[circles]
DIAMETER_MIN_ENCLOSING_CIRCLE = "Diameter in pixels of the circle that Welzl's algorithm fits to the ROI's contour pixels, with chord midpoints truncated to whole pixels (known defect, https://github.com/PolusAI/nyxus/issues/498); it approximates the smallest enclosing circle and can come out about a pixel larger or smaller than it."
DIAMETER_CIRCUMSCRIBING_CIRCLE = "Twice the largest distance from the ROI's centroid to its contour pixels, in pixels. The contour is taken one pixel down and to the right of the ROI and the centroid one pixel up and to the left (known defect, https://github.com/PolusAI/nyxus/issues/497)."
DIAMETER_INSCRIBING_CIRCLE = "Twice the smallest distance from the ROI's centroid to its contour pixels, in pixels. The contour is taken one pixel down and to the right of the ROI and the centroid one pixel up and to the left (known defect, https://github.com/PolusAI/nyxus/issues/497)."

[roi_radius]
ROI_RADIUS_MEAN = "Mean over ROI pixels of the distance from a pixel to the nearest contour pixel, with the contour taken one pixel down and to the right of the ROI (known defect, https://github.com/PolusAI/nyxus/issues/497)"
ROI_RADIUS_MAX = "Maximum over ROI pixels of the distance from a pixel to the nearest contour pixel, with the contour taken one pixel down and to the right of the ROI (known defect, https://github.com/PolusAI/nyxus/issues/497)"
ROI_RADIUS_MEDIAN = "Median over ROI pixels of the distance from a pixel to the nearest contour pixel, with the contour taken one pixel down and to the right of the ROI (known defect, https://github.com/PolusAI/nyxus/issues/497)"

[extrema]
EXTREMA_P1_X = "X coordinate of extremum point 1: the leftmost ROI pixel in the ROI's top row."
EXTREMA_P1_Y = "Y coordinate of extremum point 1: the ROI's top row (the bounding box's minimum y)."
EXTREMA_P2_X = "X coordinate of extremum point 2: the rightmost ROI pixel in the ROI's top row."
EXTREMA_P2_Y = "Y coordinate of extremum point 2: the ROI's top row (the bounding box's minimum y)."
EXTREMA_P3_X = "X coordinate of extremum point 3: the ROI's rightmost column (the bounding box's maximum x)."
EXTREMA_P3_Y = "Y coordinate of extremum point 3: the topmost ROI pixel in the ROI's rightmost column."
EXTREMA_P4_X = "X coordinate of extremum point 4: the ROI's rightmost column (the bounding box's maximum x)."
EXTREMA_P4_Y = "Y coordinate of extremum point 4: the bottommost ROI pixel in the ROI's rightmost column."
EXTREMA_P5_X = "X coordinate of extremum point 5: the rightmost ROI pixel in the ROI's bottom row."
EXTREMA_P5_Y = "Y coordinate of extremum point 5: the ROI's bottom row (the bounding box's maximum y)."
EXTREMA_P6_X = "X coordinate of extremum point 6: the leftmost ROI pixel in the ROI's bottom row."
EXTREMA_P6_Y = "Y coordinate of extremum point 6: the ROI's bottom row (the bounding box's maximum y)."
EXTREMA_P7_X = "X coordinate of extremum point 7: the ROI's leftmost column (the bounding box's minimum x)."
EXTREMA_P7_Y = "Y coordinate of extremum point 7: the bottommost ROI pixel in the ROI's leftmost column."
EXTREMA_P8_X = "X coordinate of extremum point 8: the ROI's leftmost column (the bounding box's minimum x)."
EXTREMA_P8_Y = "Y coordinate of extremum point 8: the topmost ROI pixel in the ROI's leftmost column."

[euler]
EULER_NUMBER = "Euler characteristic of the ROI - the number of objects in the ROI minus the number of holes assuming the 8-neighbor connectivity of ROI's pixels"

[erosion]
EROSIONS_2_VANISH = "Number of binary erosions with a 3x3 cross-shaped structuring element, applied to the ROI mask inside its bounding box, before the one that leaves no pixel set in the eroded area; the first two and the last row and column of the box are never eroded, so a ROI that fills its box, such as a solid rectangle of at least 4x4 pixels, never vanishes and reports the cap of 1000. 0 for ROIs of a single intensity."
EROSIONS_2_VANISH_COMPLEMENT = "Not computed: the column is never assigned and keeps its initial value of 0."

[fractal]
FRACT_DIM_BOXCOUNT = "Box-counting fractal dimension of the ROI mask: minus the least-squares slope of log box count versus log box size over power-of-two box sizes; ROIs whose padded side is 32 pixels or less take the smallest count over four grid offsets."
FRACT_DIM_PERIMETER = "Divider (Richardson) fractal dimension of the ROI's contour: 1 minus the least-squares slope of log perimeter versus log mean ruler length, where the contour is walked with strides of decreasing numbers of contour pixels."

[geodetic]
GEODETIC_LENGTH = "Length of a rectangle with the same area and perimeter as the ROI: PERIMETER divided by 4 plus the square root of (PERIMETER squared divided by 16 minus the area), in pixels; when that difference is negative, as for a disk, no such rectangle exists and the value is PERIMETER divided by 4."
THICKNESS = "Width of a rectangle with the same area and perimeter as the ROI: PERIMETER divided by 2 minus GEODETIC_LENGTH, in pixels; equal to GEODETIC_LENGTH, PERIMETER divided by 4, when no such rectangle exists."

[feret]
MIN_FERET_ANGLE = "Rotation angle in degrees (0 to 180, in 10-degree steps) at which the ROI's convex hull has its smallest Feret diameter."
MAX_FERET_ANGLE = "Rotation angle in degrees (0 to 180, in 10-degree steps) at which the ROI's convex hull has its largest Feret diameter."
STAT_FERET_DIAM_MIN = "Smallest Feret (caliper) diameter of the ROI's convex hull over rotations from 0 to 180 degrees in 10-degree steps, in pixels."
STAT_FERET_DIAM_MAX = "Largest Feret (caliper) diameter of the ROI's convex hull over rotations from 0 to 180 degrees in 10-degree steps, in pixels."
STAT_FERET_DIAM_MEAN = "Mean Feret (caliper) diameter of the ROI's convex hull over rotations from 0 to 180 degrees in 10-degree steps, in pixels."
STAT_FERET_DIAM_MEDIAN = "Median Feret (caliper) diameter of the ROI's convex hull over rotations from 0 to 180 degrees in 10-degree steps, in pixels."
STAT_FERET_DIAM_STDDEV = "Population standard deviation of the Feret (caliper) diameters of the ROI's convex hull over rotations from 0 to 180 degrees in 10-degree steps, in pixels."
STAT_FERET_DIAM_MODE = "Mode of the Feret diameters of the ROI's convex hull over rotations from 0 to 180 degrees, taken over 1-pixel-wide bins and reported as the bin's whole-pixel value."

[martin]
STAT_MARTIN_DIAM_MIN = "Smallest Martin diameter of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps; the Martin diameter is the length of the horizontal chord that splits the hull's area in half, in pixels."
STAT_MARTIN_DIAM_MAX = "Largest Martin diameter (area-bisecting horizontal chord) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_MARTIN_DIAM_MEAN = "Mean Martin diameter (area-bisecting horizontal chord) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_MARTIN_DIAM_MEDIAN = "Median Martin diameter (area-bisecting horizontal chord) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_MARTIN_DIAM_STDDEV = "Population standard deviation of the Martin diameters (area-bisecting horizontal chords) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_MARTIN_DIAM_MODE = "Mode of the Martin diameters of the ROI's convex hull over rotations from 0 to 170 degrees, taken over 1-pixel-wide bins and reported as the bin's whole-pixel value."

[nassenstein]
STAT_NASSENSTEIN_DIAM_MIN = "Smallest Nassenstein diameter of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps; the Nassenstein diameter is the hull's vertical extent through its lowest point, in pixels."
STAT_NASSENSTEIN_DIAM_MAX = "Largest Nassenstein diameter (vertical extent through the lowest point) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_NASSENSTEIN_DIAM_MEAN = "Mean Nassenstein diameter (vertical extent through the lowest point) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_NASSENSTEIN_DIAM_MEDIAN = "Median Nassenstein diameter (vertical extent through the lowest point) of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_NASSENSTEIN_DIAM_STDDEV = "Population standard deviation of the Nassenstein diameters of the ROI's convex hull over rotations from 0 to 170 degrees in 10-degree steps, in pixels."
STAT_NASSENSTEIN_DIAM_MODE = "Mode of the Nassenstein diameters of the ROI's convex hull over rotations from 0 to 170 degrees, taken over 1-pixel-wide bins and reported as the bin's whole-pixel value."

[chords]
MAXCHORDS_MAX = "Largest of the ROI's maximum chords, in pixels. At each of 20 rotations from 0 to 171 degrees in 9-degree steps, a chord is the longest vertical run of ROI pixels, ending before the raster's last row, in a sampled column of the rotated ROI (every column under 200 pixels of width, otherwise every (width/100)-th), and the maximum chord is the longest of them."
MAXCHORDS_MAX_ANG = "Rotation angle in radians at which MAXCHORDS_MAX occurs."
MAXCHORDS_MIN = "Smallest of the ROI's per-rotation maximum chords (see MAXCHORDS_MAX), one for each of the 20 rotations that has a chord, in pixels."
MAXCHORDS_MIN_ANG = "Rotation angle in radians at which MAXCHORDS_MIN occurs."
MAXCHORDS_MEDIAN = "Median of the ROI's per-rotation maximum chords, one for each of the 20 rotations that has a chord, in pixels."
MAXCHORDS_MEAN = "Mean of the ROI's per-rotation maximum chords, one for each of the 20 rotations that has a chord, in pixels."
MAXCHORDS_MODE = "Most frequent length among the ROI's per-rotation maximum chords, one for each of the 20 rotations that has a chord, in pixels; the smallest such length on ties."
MAXCHORDS_STDDEV = "Unbiased (n-1) standard deviation of the ROI's per-rotation maximum chords, one for each of the 20 rotations that has a chord, in pixels."
ALLCHORDS_MAX = "Longest of all the ROI's chords, in pixels: one chord per column, the column's longest vertical run of ROI pixels ending before the raster's last row, over the columns of the ROI rotated by 0 to 171 degrees in 9-degree steps; every column when the rotated ROI is under 200 pixels wide, otherwise every (width/100)-th column."
ALLCHORDS_MAX_ANG = "Rotation angle in radians at which ALLCHORDS_MAX occurs."
ALLCHORDS_MIN = "Shortest of all the ROI's chords (see ALLCHORDS_MAX), in pixels."
ALLCHORDS_MIN_ANG = "Rotation angle in radians at which ALLCHORDS_MIN occurs."
ALLCHORDS_MEDIAN = "Median length of all the ROI's chords, in pixels."
ALLCHORDS_MEAN = "Mean length of all the ROI's chords, in pixels."
ALLCHORDS_MODE = "Most frequent length among all the ROI's chords, in pixels; the smallest such length on ties."
ALLCHORDS_STDDEV = "Unbiased (n-1) standard deviation of the lengths of all the ROI's chords, in pixels."

[neighbors]
NUM_NEIGHBORS = "Number of other ROIs whose contour comes within --pixelDistance pixels (default 5, Euclidean distance between contour pixels) of this ROI's contour."
PERCENT_TOUCHING = "Percentage of the ROI's contour pixels that are adjacent, including diagonally, to a contour pixel of another ROI."
CLOSEST_NEIGHBOR1_DIST = "Distance in pixels from the ROI's centroid to the centroid of its nearest neighbor among the ROIs counted in NUM_NEIGHBORS."
CLOSEST_NEIGHBOR1_ANG = "Direction in degrees (0 to 360, from the x axis with y increasing downward) from the ROI's centroid to the centroid of its nearest neighbor."
CLOSEST_NEIGHBOR2_DIST = "Distance in pixels from the ROI's centroid to the centroid of its second-nearest neighbor among the ROIs counted in NUM_NEIGHBORS."
CLOSEST_NEIGHBOR2_ANG = "Direction in degrees (0 to 360, from the x axis with y increasing downward) from the ROI's centroid to the centroid of its second-nearest neighbor."
ANG_BW_NEIGHBORS_MEAN = "Arithmetic mean of the directions in degrees (0 to 360) from the ROI's centroid to the centroids of all its neighbors."
ANG_BW_NEIGHBORS_STDDEV = "Unbiased (n-1) standard deviation of the directions in degrees from the ROI's centroid to the centroids of its neighbors; 0 with fewer than 3 neighbors (with 2, a known defect, https://github.com/PolusAI/nyxus/issues/499)."
ANG_BW_NEIGHBORS_MODE = "Most frequent direction, rounded to whole degrees, from the ROI's centroid to the centroids of its neighbors; the smallest such angle on ties."

[glcm]
GLCM_ASM = "Angular second moment: the sum of the squared co-occurrence probabilities, which is high when a few grey-level pairs dominate (a uniform texture)."
GLCM_ACOR = "Autocorrelation: the co-occurrence-weighted mean of the product of the two grey levels of a pixel pair, which grows with both coarseness and brightness."
GLCM_CLUPROM = "Cluster prominence: the fourth moment of the sum of the two grey levels of a pair about twice the neighbour pixel's mean grey level, which is large when that distribution is asymmetric or heavy-tailed."
GLCM_CLUSHADE = "Cluster shade: the third moment of the sum of the two grey levels of a pair about twice the neighbour pixel's mean grey level, which measures the skewness of the co-occurrence matrix."
GLCM_CLUTEND = "Cluster tendency: the second moment of the sum of the two grey levels of a pair about twice the neighbour pixel's mean grey level, which measures how strongly pairs group into similar grey levels."
GLCM_CONTRAST = "Contrast: the co-occurrence-weighted mean squared grey-level difference between the two pixels of a pair, which grows with local intensity variation."
GLCM_CORRELATION = "Correlation: the linear correlation, from -1 to 1, between the grey levels of the two pixels of a pair."
GLCM_DIFAVE = "Difference average: the mean absolute grey-level difference between the two pixels of a pair, taken from the distribution of those differences."
GLCM_DIFENTRO = "Difference entropy: the base-2 entropy of the distribution of absolute grey-level differences between paired pixels."
GLCM_DIFVAR = "Difference variance: the variance of the absolute grey-level difference between paired pixels about its mean."
GLCM_DIS = "Dissimilarity: the co-occurrence-weighted mean absolute difference between the grey levels of the two pixels of a pair, taken directly from the co-occurrence matrix."
GLCM_ENERGY = "Energy: the sum of the squared co-occurrence probabilities; it returns the same value as GLCM_ASM."
GLCM_ENTROPY = "Entropy: the base-2 entropy of the co-occurrence probabilities, which is high when many grey-level pairs are about equally likely; it returns the same value as GLCM_JE."
GLCM_HOM1 = "Homogeneity 1: the co-occurrence probabilities weighted by one over one plus the grey-level difference of the pair; it returns the same value as GLCM_ID."
GLCM_HOM2 = "Homogeneity 2: the co-occurrence probabilities weighted by one over one plus the squared grey-level difference of the pair; it returns the same value as GLCM_IDM and has no _AVE code."
GLCM_ID = "Inverse difference: the co-occurrence probabilities weighted by one over one plus the grey-level difference of the pair, which is high when paired pixels have similar grey levels."
GLCM_IDN = "Inverse difference normalized: inverse difference with the grey-level difference divided by the number of grey levels, which makes it less dependent on the number of grey levels."
GLCM_IDM = "Inverse difference moment: the co-occurrence probabilities weighted by one over one plus the squared grey-level difference of the pair, a measure of local homogeneity."
GLCM_IDMN = "Inverse difference moment normalized: inverse difference moment with the squared grey-level difference divided by the squared number of grey levels."
GLCM_INFOMEAS1 = "Informational measure of correlation 1: the joint entropy minus the entropy expected if the two grey levels were independent, divided by the entropy of one marginal distribution; it measures how much the two grey levels depend on each other."
GLCM_INFOMEAS2 = "Informational measure of correlation 2: a 0-to-1 measure of the dependence between the two grey levels of a pair, computed from the gap between the joint entropy and the entropy of the product of the marginals."
GLCM_IV = "Inverse variance: the distribution of grey-level differences between paired pixels weighted by one over the squared difference, leaving out pairs with equal grey levels."
GLCM_JAVE = "Joint average: the co-occurrence-weighted mean grey level of the reference pixel of a pair."
GLCM_JE = "Joint entropy: the base-2 entropy of the co-occurrence probabilities, which is high when many grey-level pairs are about equally likely."
GLCM_JMAX = "Joint maximum: the largest co-occurrence probability, that is the share of pairs taken by the most common grey-level pair."
GLCM_JVAR = "Joint variance: the co-occurrence-weighted spread of the neighbour pixel's grey level around the joint average (the reference pixel's mean); it equals GLCM_VARIANCE only when the matrix is symmetric."
GLCM_SUMAVERAGE = "Sum average: the mean of the sum of the two grey levels of a pixel pair."
GLCM_SUMENTROPY = "Sum entropy: the base-2 entropy of the distribution of the sum of the two grey levels of a pixel pair."
GLCM_SUMVARIANCE = "Sum variance: the spread of the sum of the two grey levels of a pair about twice the neighbour pixel's mean grey level; this code returns the cluster tendency value, the same as GLCM_CLUTEND."
GLCM_VARIANCE = "Variance: the co-occurrence-weighted variance of the reference pixel's grey level about its mean (PyRadiomics sum of squares)."
GLCM_ASM_AVE = "Angular second moment, averaged over the angles."
GLCM_ACOR_AVE = "Autocorrelation, averaged over the angles."
GLCM_CLUPROM_AVE = "Cluster prominence, averaged over the angles."
GLCM_CLUSHADE_AVE = "Cluster shade, averaged over the angles."
GLCM_CLUTEND_AVE = "Cluster tendency, averaged over the angles."
GLCM_CONTRAST_AVE = "Contrast, averaged over the angles."
GLCM_CORRELATION_AVE = "Correlation, averaged over the angles."
GLCM_DIFAVE_AVE = "Difference average, averaged over the angles."
GLCM_DIFENTRO_AVE = "Difference entropy, averaged over the angles."
GLCM_DIFVAR_AVE = "Difference variance, averaged over the angles."
GLCM_DIS_AVE = "Dissimilarity, averaged over the angles."
GLCM_ENERGY_AVE = "Energy, averaged over the angles."
GLCM_ENTROPY_AVE = "Entropy, averaged over the angles."
GLCM_HOM1_AVE = "Homogeneity 1, averaged over the angles."
GLCM_ID_AVE = "Inverse difference, averaged over the angles."
GLCM_IDN_AVE = "Inverse difference normalized, averaged over the angles."
GLCM_IDM_AVE = "Inverse difference moment, averaged over the angles."
GLCM_IDMN_AVE = "Inverse difference moment normalized, averaged over the angles."
GLCM_IV_AVE = "Inverse variance, averaged over the angles."
GLCM_JAVE_AVE = "Joint average, averaged over the angles."
GLCM_JE_AVE = "Joint entropy, averaged over the angles."
GLCM_INFOMEAS1_AVE = "Informational measure of correlation 1, averaged over the angles."
GLCM_INFOMEAS2_AVE = "Informational measure of correlation 2, averaged over the angles."
GLCM_VARIANCE_AVE = "Variance, averaged over the angles."
GLCM_JMAX_AVE = "Joint maximum, averaged over the angles."
GLCM_JVAR_AVE = "Joint variance, averaged over the angles."
GLCM_SUMAVERAGE_AVE = "Sum average, averaged over the angles."
GLCM_SUMENTROPY_AVE = "Sum entropy, averaged over the angles."
GLCM_SUMVARIANCE_AVE = "Sum variance, averaged over the angles."

[glrlm]
GLRLM_SRE = "Short run emphasis: the mean over all runs of one over the squared run length, which is high when short runs dominate (fine texture)."
GLRLM_LRE = "Long run emphasis: the mean over all runs of the squared run length, which is high when long runs dominate (coarse texture)."
GLRLM_GLN = "Grey level non-uniformity: the sum over grey levels of the squared number of runs at that level, divided by the number of runs; it is low when runs are spread evenly over the grey levels."
GLRLM_GLNN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of runs once more, giving a value between 0 and 1."
GLRLM_RLN = "Run length non-uniformity: the sum over run lengths of the squared number of runs of that length, divided by the number of runs; it is low when run lengths are spread evenly."
GLRLM_RLNN = "Run length non-uniformity normalized: run length non-uniformity divided by the number of runs once more, giving a value between 0 and 1."
GLRLM_RP = "Run percentage: the number of runs divided by the number of ROI pixels, which is high for fine texture; with the default binning, runs of bounding-box pixels outside the mask are counted too, so it can exceed 1."
GLRLM_GLV = "Grey level variance: the variance of the grey level over all runs."
GLRLM_RV = "Run variance: the variance of the run length over all runs."
GLRLM_RE = "Run entropy: the base-2 entropy of the joint distribution of run grey level and run length."
GLRLM_LGLRE = "Low grey level run emphasis: the mean over all runs of one over the squared grey level, which is high when dark runs dominate."
GLRLM_HGLRE = "High grey level run emphasis: the mean over all runs of the squared grey level, which is high when bright runs dominate."
GLRLM_SRLGLE = "Short run low grey level emphasis: the mean over all runs of one over the squared run length times the squared grey level, which is high for short dark runs."
GLRLM_SRHGLE = "Short run high grey level emphasis: the mean over all runs of the squared grey level over the squared run length, which is high for short bright runs."
GLRLM_LRLGLE = "Long run low grey level emphasis: the mean over all runs of the squared run length over the squared grey level, which is high for long dark runs."
GLRLM_LRHGLE = "Long run high grey level emphasis: the mean over all runs of the squared run length times the squared grey level, which is high for long bright runs."
GLRLM_SRE_AVE = "Short run emphasis, averaged over the angles."
GLRLM_LRE_AVE = "Long run emphasis, averaged over the angles."
GLRLM_GLN_AVE = "Grey level non-uniformity, averaged over the angles."
GLRLM_GLNN_AVE = "Grey level non-uniformity normalized, averaged over the angles."
GLRLM_RLN_AVE = "Run length non-uniformity, averaged over the angles."
GLRLM_RLNN_AVE = "Run length non-uniformity normalized, averaged over the angles."
GLRLM_RP_AVE = "Run percentage, averaged over the angles."
GLRLM_GLV_AVE = "Grey level variance, averaged over the angles."
GLRLM_RV_AVE = "Run variance, averaged over the angles."
GLRLM_RE_AVE = "Run entropy, averaged over the angles."
GLRLM_LGLRE_AVE = "Low grey level run emphasis, averaged over the angles."
GLRLM_HGLRE_AVE = "High grey level run emphasis, averaged over the angles."
GLRLM_SRLGLE_AVE = "Short run low grey level emphasis, averaged over the angles."
GLRLM_SRHGLE_AVE = "Short run high grey level emphasis, averaged over the angles."
GLRLM_LRLGLE_AVE = "Long run low grey level emphasis, averaged over the angles."
GLRLM_LRHGLE_AVE = "Long run high grey level emphasis, averaged over the angles."

[glszm]
GLSZM_SAE = "Small area emphasis: the mean over all zones of one over the squared zone size, which is high when small zones dominate (fine texture); IBSI calls it small zone emphasis."
GLSZM_LAE = "Large area emphasis: the mean over all zones of the squared zone size, which is high when large zones dominate (coarse texture); IBSI calls it large zone emphasis."
GLSZM_GLN = "Grey level non-uniformity: the sum over grey levels of the squared number of zones at that level, divided by the number of zones; it is low when zones are spread evenly over the grey levels."
GLSZM_GLNN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
GLSZM_SZN = "Size zone non-uniformity: the sum over zone sizes of the squared number of zones of that size, divided by the number of zones; it is low when zone sizes are spread evenly."
GLSZM_SZNN = "Size zone non-uniformity normalized: size zone non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
GLSZM_ZP = "Zone percentage: the number of zones divided by the number of pixels in zones, which is high for fine texture; with the default binning every pixel of the bounding box is in a zone, inside the mask or not."
GLSZM_GLV = "Grey level variance: the variance of the grey level over all zones."
GLSZM_ZV = "Zone variance: the variance of the zone size over all zones."
GLSZM_ZE = "Zone entropy: the base-2 entropy of the joint distribution of zone grey level and zone size."
GLSZM_LGLZE = "Low grey level zone emphasis: the mean over all zones of one over the squared grey level, which is high when dark zones dominate."
GLSZM_HGLZE = "High grey level zone emphasis: the mean over all zones of the squared grey level, which is high when bright zones dominate."
GLSZM_SALGLE = "Small area low grey level emphasis: the mean over all zones of one over the squared zone size times the squared grey level, which is high for small dark zones."
GLSZM_SAHGLE = "Small area high grey level emphasis: the mean over all zones of the squared grey level over the squared zone size, which is high for small bright zones."
GLSZM_LALGLE = "Large area low grey level emphasis: the mean over all zones of the squared zone size over the squared grey level, which is high for large dark zones."
GLSZM_LAHGLE = "Large area high grey level emphasis: the mean over all zones of the squared zone size times the squared grey level, which is high for large bright zones."

[gldm]
GLDM_SDE = "Small dependence emphasis: the mean over all pixels of one over the squared dependence, which is high when pixels have few same-level neighbours (heterogeneous texture)."
GLDM_LDE = "Large dependence emphasis: the mean over all pixels of the squared dependence, which is high when pixels have many same-level neighbours (homogeneous texture)."
GLDM_GLN = "Grey level non-uniformity: the sum over grey levels of the squared number of pixels at that level, divided by the number of pixels; it is low when the grey levels are evenly represented."
GLDM_DN = "Dependence non-uniformity: the sum over dependence values of the squared number of pixels with that dependence, divided by the number of pixels; it is low when dependences are spread evenly."
GLDM_DNN = "Dependence non-uniformity normalized: dependence non-uniformity divided by the number of pixels once more, giving a value between 0 and 1."
GLDM_GLV = "Grey level variance: the variance of the grey level over the dependence matrix."
GLDM_DV = "Dependence variance: the variance of the dependence over the dependence matrix."
GLDM_DE = "Dependence entropy: the base-2 entropy of the joint distribution of grey level and dependence."
GLDM_LGLE = "Low grey level emphasis: the mean over all pixels of one over the squared grey level, which is high when dark pixels dominate."
GLDM_HGLE = "High grey level emphasis: the mean over all pixels of the squared grey level, which is high when bright pixels dominate."
GLDM_SDLGLE = "Small dependence low grey level emphasis: the mean over all pixels of one over the squared dependence times the squared grey level, which is high for dark pixels with few same-level neighbours."
GLDM_SDHGLE = "Small dependence high grey level emphasis: the mean over all pixels of the squared grey level over the squared dependence, which is high for bright pixels with few same-level neighbours."
GLDM_LDLGLE = "Large dependence low grey level emphasis: the mean over all pixels of the squared dependence over the squared grey level, which is high for dark pixels with many same-level neighbours."
GLDM_LDHGLE = "Large dependence high grey level emphasis: the mean over all pixels of the squared dependence times the squared grey level, which is high for bright pixels with many same-level neighbours."

[gldzm]
GLDZM_SDE = "Small distance emphasis: the mean over all zones of one over the squared zone distance, which is high when zones lie close to the ROI edge."
GLDZM_LDE = "Large distance emphasis: the mean over all zones of the squared zone distance, which is high when zones lie deep inside the ROI."
GLDZM_LGLZE = "Low grey level zone emphasis: the mean over all zones of one over the squared grey level, which is high when dark zones dominate."
GLDZM_HGLZE = "High grey level zone emphasis: the mean over all zones of the squared grey level, which is high when bright zones dominate."
GLDZM_SDLGLE = "Small distance low grey level emphasis: the mean over all zones of one over the squared zone distance times the squared grey level, which is high for dark zones near the ROI edge."
GLDZM_SDHGLE = "Small distance high grey level emphasis: the mean over all zones of the squared grey level over the squared zone distance, which is high for bright zones near the ROI edge."
GLDZM_LDLGLE = "Large distance low grey level emphasis: the mean over all zones of the squared zone distance over the squared grey level, which is high for dark zones deep inside the ROI."
GLDZM_LDHGLE = "Large distance high grey level emphasis: the mean over all zones of the squared zone distance times the squared grey level, which is high for bright zones deep inside the ROI."
GLDZM_GLNU = "Grey level non-uniformity: the sum over grey levels of the squared number of zones at that level, divided by the number of zones; it is low when zones are spread evenly over the grey levels."
GLDZM_GLNUN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
GLDZM_ZDNU = "Zone distance non-uniformity: the sum over distances of the squared number of zones at that distance, divided by the number of zones; it is low when zone distances are spread evenly."
GLDZM_ZDNUN = "Zone distance non-uniformity normalized: zone distance non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
GLDZM_ZP = "Zone percentage: the number of zones divided by the number of ROI pixels, which is high for fine texture."
GLDZM_GLM = "Grey level mean: the mean grey level over all zones."
GLDZM_GLV = "Grey level variance: the variance of the grey level over all zones."
GLDZM_ZDM = "Zone distance mean: the mean zone distance over all zones."
GLDZM_ZDV = "Zone distance variance: the variance of the zone distance over all zones."
GLDZM_ZDE = "Zone distance entropy: the base-2 entropy of the joint distribution of zone grey level and zone distance."

[ngldm]
NGLDM_LDE = "Low dependence emphasis: the mean over all ROI pixels of one over the squared dependence count, which is high when pixels have few same-level neighbours."
NGLDM_HDE = "High dependence emphasis: the mean over all ROI pixels of the squared dependence count, which is high when pixels have many same-level neighbours."
NGLDM_LGLCE = "Low grey level count emphasis: the mean over all ROI pixels of one over the squared grey level, which is high when dark pixels dominate."
NGLDM_HGLCE = "High grey level count emphasis: the mean over all ROI pixels of the squared grey level, which is high when bright pixels dominate."
NGLDM_LDLGLE = "Low dependence low grey level emphasis: the mean over all ROI pixels of one over the squared dependence count times the squared grey level, which is high for dark pixels with few same-level neighbours."
NGLDM_LDHGLE = "Low dependence high grey level emphasis: the mean over all ROI pixels of the squared grey level over the squared dependence count, which is high for bright pixels with few same-level neighbours."
NGLDM_HDLGLE = "High dependence low grey level emphasis: the mean over all ROI pixels of the squared dependence count over the squared grey level, which is high for dark pixels with many same-level neighbours."
NGLDM_HDHGLE = "High dependence high grey level emphasis: the mean over all ROI pixels of the squared dependence count times the squared grey level, which is high for bright pixels with many same-level neighbours."
NGLDM_GLNU = "Grey level non-uniformity: the sum over grey levels of the squared number of pixels at that level, divided by the number of pixels; it is low when the grey levels are evenly represented."
NGLDM_GLNUN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of pixels once more, giving a value between 0 and 1."
NGLDM_DCNU = "Dependence count non-uniformity: the sum over dependence counts of the squared number of pixels with that count, divided by the number of pixels; it is low when dependence counts are spread evenly."
NGLDM_DCNUN = "Dependence count non-uniformity normalized: dependence count non-uniformity divided by the number of pixels once more, giving a value between 0 and 1."
NGLDM_DCP = "Dependence count percentage: the fraction of ROI pixels that serve as neighbourhood centres; every ROI pixel is one, so the value is always 1."
NGLDM_GLM = "Grey level mean: the mean grey level over the dependence matrix."
NGLDM_GLV = "Grey level variance: the variance of the grey level over the dependence matrix."
NGLDM_DCM = "Dependence count mean: the mean dependence count over the dependence matrix."
NGLDM_DCV = "Dependence count variance: the variance of the dependence count over the dependence matrix."
NGLDM_DCENT = "Dependence count entropy: the base-2 entropy of the joint distribution of grey level and dependence count."
NGLDM_DCENE = "Dependence count energy: the sum of the squared probabilities of the dependence matrix, which is high when a few combinations of grey level and dependence count dominate."

[ngtdm]
NGTDM_COARSENESS = "Coarseness: one over the probability-weighted sum of the differences between each grey level and its neighbourhood averages, which is high when intensity changes slowly (large uniform patches)."
NGTDM_CONTRAST = "Contrast: the spread of the grey levels present multiplied by the mean difference between a pixel and its neighbourhood average, which is high when both the dynamic range and the local variation are large."
NGTDM_BUSYNESS = "Busyness: the probability-weighted neighbourhood differences divided by the summed differences between probability-weighted grey levels, which is high when intensity changes rapidly from pixel to pixel."
NGTDM_COMPLEXITY = "Complexity: the grey-level differences between pairs of levels weighted by their neighbourhood differences, which is high when the image has many abrupt intensity changes."
NGTDM_STRENGTH = "Strength: the probability-weighted squared differences between grey levels divided by the summed neighbourhood differences, which is high when the image has large, distinct regions of different intensity."

