IMOM_WCM_02 = "Central intensity moment of order (0, 2) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WCM_03 = "Central intensity moment of order (0, 3) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WCM_11 = "Central intensity moment of order (1, 1) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WCM_12 = "Central intensity moment of order (1, 2) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WCM_20 = "Central intensity moment of order (2, 0) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WCM_21 = "Central intensity moment of order (2, 1) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WCM_30 = "Central intensity moment of order (3, 0) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_02 = "Normalized central intensity moment of order (0, 2) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_03 = "Normalized central intensity moment of order (0, 3) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_11 = "Normalized central intensity moment of order (1, 1) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_12 = "Normalized central intensity moment of order (1, 2) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_20 = "Normalized central intensity moment of order (2, 0) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_21 = "Normalized central intensity moment of order (2, 1) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WNCM_30 = "Normalized central intensity moment of order (3, 0) with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU1 = "Hu's invariant number 1 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU2 = "Hu's invariant number 2 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU3 = "Hu's invariant number 3 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU4 = "Hu's invariant number 4 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU5 = "Hu's invariant number 5 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU6 = "Hu's invariant number 6 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."
IMOM_WHU7 = "Hu's invariant number 7 of the ROI's intensities with each pixel's intensity multiplied by ln(d + 0.001), where d is as in the family note."

[gabor]
GABOR = "Multi-column feature GABOR_0 to GABOR_N-1, one column per configured (frequency, orientation) pair. Each value is the number of bounding-box pixels (pixels outside the mask count as 0) whose Gabor filter response, divided by the maximum response of a low-pass baseline Gabor filter, exceeds a threshold (default 0.025), divided by the number of pixels where the baseline response exceeds its minimum; 0 for ROIs of a single intensity."

[zernike]
ZERNIKE2D = "Multi-column feature ZERNIKE2D_Z0 to ZERNIKE2D_Z29: the magnitudes of the 30 Zernike moments of orders 0 to 9 (repetitions with order minus repetition even) of the ROI's intensity image, over a unit disk centred on the intensity centroid whose radius is the smaller side of the ROI's bounding box."

[radial]
FRAC_AT_D = "Multi-column feature FRAC_AT_D_0 to FRAC_AT_D_7: the fraction of the ROI's pixels in each of 8 radial bins around the ROI's center pixel: 7 equal rings out to the distance of the farthest contour pixel, as an approximate search finds it, plus an eighth ring for every pixel at or beyond that distance (differs from CellProfiler FracAtD, the fraction of total intensity)."
MEAN_FRAC = "Multi-column feature MEAN_FRAC_0 to MEAN_FRAC_7: the mean pixel intensity in each of the 8 radial bins used by FRAC_AT_D (differs from CellProfiler MeanFrac, the fraction of intensity divided by the fraction of pixels)."
RADIAL_CV = "Multi-column feature RADIAL_CV_0 to RADIAL_CV_7: for each of the 8 radial bins used by FRAC_AT_D, the coefficient of variation (population standard deviation over mean) of the summed intensity across 8 equal angular wedges around the ROI's center pixel."

[intensity_3d]
3COV = "Coefficient of variation: the unbiased (n-1) standard deviation of the ROI's voxel intensities divided by their mean; 0 when the mean is 0."
3COVERED_IMAGE_INTENSITY_RANGE = "Ratio of the ROI's intensity range (3MAX minus 3MIN) to the intensity range of the voxels of all ROIs in the volume; voxels outside every ROI are not used."
3ENERGY = "Sum of the squared voxel intensities of the ROI."
3ENTROPY = "Shannon entropy (base 2) of the ROI's intensity histogram, binned into |--coarseGrayDepth| equal-width bins (default 64) spanning the ROI's minimum to maximum intensity."
3EXCESS_KURTOSIS = "Excess kurtosis of the ROI's voxel intensities: the population fourth standardized moment minus 3; 0 for ROIs with fewer than 5 voxels or a single intensity."
3HYPERFLATNESS = "Sixth standardized moment of the ROI's voxel intensities: the mean sixth power of the deviations from the mean, divided by the sixth power of the unbiased (n-1) standard deviation."
3HYPERSKEWNESS = "Fifth standardized moment of the ROI's voxel intensities: the mean fifth power of the deviations from the mean, divided by the fifth power of the unbiased (n-1) standard deviation."
3INTEGRATED_INTENSITY = "Sum of the voxel intensities of the ROI."
3INTERQUARTILE_RANGE = "Difference between the 75th and 25th percentiles (3P75 minus 3P25) of the ROI's voxel intensities."
3KURTOSIS = "Pearson kurtosis of the ROI's voxel intensities: the population fourth standardized moment, without subtracting 3; 0 for ROIs with fewer than 5 voxels or a single intensity."
3MAX = "Maximum voxel intensity in the ROI."
3MEAN = "Mean voxel intensity of the ROI."
3MEAN_ABSOLUTE_DEVIATION = "Mean absolute deviation of the ROI's voxel intensities from their mean."
3MEDIAN = "Median voxel intensity of the ROI; the average of the two middle values when the voxel count is even."
3MEDIAN_ABSOLUTE_DEVIATION = "Mean absolute deviation of the ROI's voxel intensities from their median (differs from the median of the absolute deviations from the median)."
3MIN = "Minimum voxel intensity in the ROI."
3MODE = "Most frequent voxel intensity in the ROI; the smallest such intensity when several share the top count."
3P01 = "1st percentile of the ROI's voxel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
3P10 = "10th percentile of the ROI's voxel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
3P25 = "25th percentile (first quartile) of the ROI's voxel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
3P75 = "75th percentile (third quartile) of the ROI's voxel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
3P90 = "90th percentile of the ROI's voxel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
3P99 = "99th percentile of the ROI's voxel intensities, interpolated within a 100-bin histogram spanning the ROI's intensity range."
3QCOD = "Quartile coefficient of dispersion: (3P75 minus 3P25) divided by (3P75 plus 3P25); 0 when the denominator is 0."
3RANGE = "Difference between the maximum and minimum voxel intensities of the ROI (3MAX minus 3MIN)."
3ROBUST_MEAN = "Mean of the ROI's voxel intensities that lie between 3P10 and 3P90, inclusive."
3ROBUST_MEAN_ABSOLUTE_DEVIATION = "Mean absolute deviation from their own mean of the ROI's voxel intensities that lie between 3P10 and 3P90, inclusive."
3ROOT_MEAN_SQUARED = "Root mean square of the ROI's voxel intensities: the square root of 3ENERGY divided by the voxel count."
3SKEWNESS = "Skewness of the ROI's voxel intensities: the population third standardized moment; 0 for ROIs with fewer than 4 voxels or a single intensity."
3STANDARD_DEVIATION = "Unbiased standard deviation of the ROI's voxel intensities, with n-1 in the denominator."
3STANDARD_DEVIATION_BIASED = "Biased (population) standard deviation of the ROI's voxel intensities, with n in the denominator."
3STANDARD_ERROR = "Standard error of the mean: the unbiased standard deviation divided by the square root of the voxel count."
3VARIANCE = "Unbiased variance of the ROI's voxel intensities, with n-1 in the denominator."
3VARIANCE_BIASED = "Biased (population) variance of the ROI's voxel intensities, with n in the denominator."
3UNIFORMITY = "Sum of the squared bin probabilities of the ROI's intensity histogram, binned into |--coarseGrayDepth| equal-width bins (default 64) spanning the ROI's minimum to maximum intensity."
3UNIFORMITY_PIU = "Percent image uniformity: (1 minus (3MAX minus 3MIN) divided by (3MAX plus 3MIN)) times 100; 0 when 3MAX plus 3MIN is 0."

[shape_3d]
3AREA = "Surface area of the ROI from its exposed voxel faces: faces of ROI voxels whose 6-connected neighbour is not in the ROI, each weighted by its area (the product of the anisotropy factors of the two axes it spans), so with no anisotropy it is the number of exposed faces (a staircase area, not a mesh area)."
3AREA_2_VOLUME = "3AREA divided by 3VOXEL_VOLUME."
3COMPACTNESS1 = "3VOXEL_VOLUME divided by the square root of pi times 3AREA cubed (differs from IBSI, which uses the mesh area and mesh volume)."
3COMPACTNESS2 = "36 pi times 3VOXEL_VOLUME squared, divided by 3AREA cubed (differs from IBSI, which uses the mesh area and mesh volume)."
3MESH_VOLUME = "Volume enclosed by the ROI's marching-cubes surface mesh, in cubic voxels."
3SPHERICAL_DISPROPORTION = "3AREA divided by the surface area of a sphere whose volume is 3VOXEL_VOLUME (differs from IBSI, which uses the mesh area and mesh volume)."
3SPHERICITY = "Surface area of a sphere whose volume is 3VOXEL_VOLUME, divided by 3AREA; the reciprocal of 3SPHERICAL_DISPROPORTION (differs from IBSI, which uses the mesh area and mesh volume)."
3VOLUME_CONVEXHULL = "Volume of the convex hull of the vertices of the ROI's marching-cubes surface mesh, in cubic voxels."
3VOXEL_VOLUME = "Volume of the ROI from its voxel count: the count times the volume of a ball of diameter 1 voxel (pi/6), divided by the packing density 0.5236, which leaves the voxel count scaled by 0.9999976, times the product of the three anisotropy factors; with a single whole-volume ROI it is the exact volume of the box Nyxus substitutes for the ROI, times the same product but without the 0.9999976 factor (on the command line and through featurize_directory a box one voxel larger than the volume on every axis, known defect, https://github.com/PolusAI/nyxus/issues/493; see the 3D shape page)."
3MAJOR_AXIS_LEN = "4 times the square root of the largest eigenvalue of the covariance matrix of the ROI's voxel coordinates, in voxels."
3MINOR_AXIS_LEN = "4 times the square root of the second-largest eigenvalue of the covariance matrix of the ROI's voxel coordinates, in voxels."
3LEAST_AXIS_LEN = "4 times the square root of the smallest eigenvalue of the covariance matrix of the ROI's voxel coordinates, in voxels."
3ELONGATION = "3MINOR_AXIS_LEN divided by 3MAJOR_AXIS_LEN: the square root of the ratio of the second-largest to the largest eigenvalue of the voxel-coordinate covariance matrix."
3FLATNESS = "3LEAST_AXIS_LEN divided by 3MAJOR_AXIS_LEN: the square root of the ratio of the smallest to the largest eigenvalue of the voxel-coordinate covariance matrix."

[glcm_3d]
3GLCM_ACOR = "Autocorrelation: the co-occurrence-weighted mean of the product of the two grey levels of a voxel pair, which grows with both coarseness and brightness."
3GLCM_ASM = "Angular second moment: the sum of the squared co-occurrence probabilities, which is high when a few grey-level pairs dominate (a uniform texture)."
3GLCM_CLUPROM = "Cluster prominence: the fourth moment of the sum of the two grey levels of a pair about twice the mean grey level, which is large when that distribution is asymmetric or heavy-tailed."
3GLCM_CLUSHADE = "Cluster shade: the third moment of the sum of the two grey levels of a pair about twice the mean grey level, which measures the skewness of the co-occurrence matrix."
3GLCM_CLUTEND = "Cluster tendency: the second moment of the sum of the two grey levels of a pair about twice the mean grey level, which measures how strongly pairs group into similar grey levels."
3GLCM_CONTRAST = "Contrast: the co-occurrence-weighted mean squared grey-level difference between the two voxels of a pair, which grows with local intensity variation."
3GLCM_CORRELATION = "Correlation: the linear correlation, from -1 to 1, between the grey levels of the two voxels of a pair."
3GLCM_DIFAVE = "Difference average: the mean absolute grey-level difference between the two voxels of a pair, taken from the distribution of those differences."
3GLCM_DIFENTRO = "Difference entropy: the base-2 entropy of the distribution of absolute grey-level differences between paired voxels."
3GLCM_DIFVAR = "Difference variance: the variance of the absolute grey-level difference between paired voxels about its mean."
3GLCM_DIS = "Dissimilarity: the co-occurrence-weighted mean absolute difference between the grey levels of the two voxels of a pair, taken directly from the co-occurrence matrix."
3GLCM_ENERGY = "Energy: the sum of the squared co-occurrence probabilities; it returns the same value as 3GLCM_ASM."
3GLCM_ENTROPY = "Entropy: the base-2 entropy of the co-occurrence probabilities, which is high when many grey-level pairs are about equally likely; it returns the same value as 3GLCM_JE."
3GLCM_HOM1 = "Homogeneity 1: the co-occurrence probabilities weighted by one over one plus the grey-level difference of the pair; it returns the same value as 3GLCM_ID."
3GLCM_HOM2 = "Homogeneity 2: the co-occurrence probabilities weighted by one over one plus the squared grey-level difference of the pair; it returns the same value as 3GLCM_IDM and has no _AVE code."
3GLCM_ID = "Inverse difference: the co-occurrence probabilities weighted by one over one plus the grey-level difference of the pair, which is high when paired voxels have similar grey levels."
3GLCM_IDN = "Inverse difference normalized: inverse difference with the grey-level difference divided by the number of grey levels, which makes it less dependent on the number of grey levels."
3GLCM_IDM = "Inverse difference moment: the co-occurrence probabilities weighted by one over one plus the squared grey-level difference of the pair, a measure of local homogeneity."
3GLCM_IDMN = "Inverse difference moment normalized: inverse difference moment with the squared grey-level difference divided by the squared number of grey levels."
3GLCM_INFOMEAS1 = "Informational measure of correlation 1: the joint entropy minus the entropy expected if the two grey levels were independent, divided by the entropy of one marginal distribution; it measures how much the two grey levels depend on each other."
3GLCM_INFOMEAS2 = "Informational measure of correlation 2: a 0-to-1 measure of the dependence between the two grey levels of a pair, computed from the gap between the joint entropy and the entropy of the product of the marginals."
3GLCM_IV = "Inverse variance: the distribution of grey-level differences between paired voxels weighted by one over the squared difference, leaving out pairs with equal grey levels."
3GLCM_JAVE = "Joint average: the co-occurrence-weighted mean grey level of the reference voxel of a pair."
3GLCM_JE = "Joint entropy: the base-2 entropy of the co-occurrence probabilities, which is high when many grey-level pairs are about equally likely."
3GLCM_JMAX = "Joint maximum: the largest co-occurrence probability, that is the share of pairs taken by the most common grey-level pair."
3GLCM_JVAR = "Joint variance: the co-occurrence-weighted spread of the neighbour voxel's grey level around the joint average (the reference voxel's mean)."
3GLCM_SUMAVERAGE = "Sum average: the mean of the sum of the two grey levels of a voxel pair."
3GLCM_SUMENTROPY = "Sum entropy: the base-2 entropy of the distribution of the sum of the two grey levels of a voxel pair."
3GLCM_SUMVARIANCE = "Sum variance: the spread of the sum of the two grey levels of a pair about twice the mean grey level; this code returns the cluster tendency value, the same as 3GLCM_CLUTEND."
3GLCM_VARIANCE = "Variance: the co-occurrence-weighted variance of the reference voxel's grey level about its mean (PyRadiomics sum of squares)."
3GLCM_ASM_AVE = "Angular second moment, averaged over the directions."
3GLCM_ACOR_AVE = "Autocorrelation, averaged over the directions."
3GLCM_CLUPROM_AVE = "Cluster prominence, averaged over the directions."
3GLCM_CLUSHADE_AVE = "Cluster shade, averaged over the directions."
3GLCM_CLUTEND_AVE = "Cluster tendency, averaged over the directions."
3GLCM_CONTRAST_AVE = "Contrast, averaged over the directions."
3GLCM_CORRELATION_AVE = "Correlation, averaged over the directions."
3GLCM_DIFAVE_AVE = "Difference average, averaged over the directions."
3GLCM_DIFENTRO_AVE = "Difference entropy, averaged over the directions."
3GLCM_DIFVAR_AVE = "Difference variance, averaged over the directions."
3GLCM_DIS_AVE = "Dissimilarity, averaged over the directions."
3GLCM_ENERGY_AVE = "Energy, averaged over the directions."
3GLCM_ENTROPY_AVE = "Entropy, averaged over the directions."
3GLCM_HOM1_AVE = "Homogeneity 1, averaged over the directions."
3GLCM_ID_AVE = "Inverse difference, averaged over the directions."
3GLCM_IDN_AVE = "Inverse difference normalized, averaged over the directions."
3GLCM_IDM_AVE = "Inverse difference moment, averaged over the directions."
3GLCM_IDMN_AVE = "Inverse difference moment normalized, averaged over the directions."
3GLCM_IV_AVE = "Inverse variance, averaged over the directions."
3GLCM_JAVE_AVE = "Joint average, averaged over the directions."
3GLCM_JE_AVE = "Joint entropy, averaged over the directions."
3GLCM_INFOMEAS1_AVE = "Informational measure of correlation 1, averaged over the directions."
3GLCM_INFOMEAS2_AVE = "Informational measure of correlation 2, averaged over the directions."
3GLCM_VARIANCE_AVE = "Variance, averaged over the directions."
3GLCM_JMAX_AVE = "Joint maximum, averaged over the directions."
3GLCM_JVAR_AVE = "Joint variance, averaged over the directions."
3GLCM_SUMAVERAGE_AVE = "Sum average, averaged over the directions."
3GLCM_SUMENTROPY_AVE = "Sum entropy, averaged over the directions."
3GLCM_SUMVARIANCE_AVE = "Sum variance, averaged over the directions."

[glrlm_3d]
3GLRLM_SRE = "Short run emphasis: the mean over all runs of one over the squared run length, which is high when short runs dominate (fine texture)."
3GLRLM_LRE = "Long run emphasis: the mean over all runs of the squared run length, which is high when long runs dominate (coarse texture)."
3GLRLM_GLN = "Grey level non-uniformity: the sum over grey levels of the squared number of runs at that level, divided by the number of runs; it is low when runs are spread evenly over the grey levels."
3GLRLM_GLNN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of runs once more, giving a value between 0 and 1."
3GLRLM_RLN = "Run length non-uniformity: the sum over run lengths of the squared number of runs of that length, divided by the number of runs; it is low when run lengths are spread evenly."
3GLRLM_RLNN = "Run length non-uniformity normalized: run length non-uniformity divided by the number of runs once more, giving a value between 0 and 1."
3GLRLM_RP = "Run percentage: the number of runs divided by the number of ROI voxels, which is high for fine texture."
3GLRLM_GLV = "Grey level variance: the variance of the grey level over all runs."
3GLRLM_RV = "Run variance: the variance of the run length over all runs."
3GLRLM_RE = "Run entropy: the base-2 entropy of the joint distribution of run grey level and run length."
3GLRLM_LGLRE = "Low grey level run emphasis: the mean over all runs of one over the squared grey level, which is high when dark runs dominate."
3GLRLM_HGLRE = "High grey level run emphasis: the mean over all runs of the squared grey level, which is high when bright runs dominate."
3GLRLM_SRLGLE = "Short run low grey level emphasis: the mean over all runs of one over the squared run length times the squared grey level, which is high for short dark runs."
3GLRLM_SRHGLE = "Short run high grey level emphasis: the mean over all runs of the squared grey level over the squared run length, which is high for short bright runs."
3GLRLM_LRLGLE = "Long run low grey level emphasis: the mean over all runs of the squared run length over the squared grey level, which is high for long dark runs."
3GLRLM_LRHGLE = "Long run high grey level emphasis: the mean over all runs of the squared run length times the squared grey level, which is high for long bright runs."
3GLRLM_SRE_AVE = "Short run emphasis, averaged over the directions."
3GLRLM_LRE_AVE = "Long run emphasis, averaged over the directions."
3GLRLM_GLN_AVE = "Grey level non-uniformity, averaged over the directions."
3GLRLM_GLNN_AVE = "Grey level non-uniformity normalized, averaged over the directions."
3GLRLM_RLN_AVE = "Run length non-uniformity, averaged over the directions."
3GLRLM_RLNN_AVE = "Run length non-uniformity normalized, averaged over the directions."
3GLRLM_RP_AVE = "Run percentage, averaged over the directions."
3GLRLM_GLV_AVE = "Grey level variance, averaged over the directions."
3GLRLM_RV_AVE = "Run variance, averaged over the directions."
3GLRLM_RE_AVE = "Run entropy, averaged over the directions."
3GLRLM_LGLRE_AVE = "Low grey level run emphasis, averaged over the directions."
3GLRLM_HGLRE_AVE = "High grey level run emphasis, averaged over the directions."
3GLRLM_SRLGLE_AVE = "Short run low grey level emphasis, averaged over the directions."
3GLRLM_SRHGLE_AVE = "Short run high grey level emphasis, averaged over the directions."
3GLRLM_LRLGLE_AVE = "Long run low grey level emphasis, averaged over the directions."
3GLRLM_LRHGLE_AVE = "Long run high grey level emphasis, averaged over the directions."

[glszm_3d]
3GLSZM_SAE = "Small area emphasis: the mean over all zones of one over the squared zone size, which is high when small zones dominate (fine texture); IBSI calls it small zone emphasis."
3GLSZM_LAE = "Large area emphasis: the mean over all zones of the squared zone size, which is high when large zones dominate (coarse texture); IBSI calls it large zone emphasis."
3GLSZM_GLN = "Grey level non-uniformity: the sum over grey levels of the squared number of zones at that level, divided by the number of zones; it is low when zones are spread evenly over the grey levels."
3GLSZM_GLNN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
3GLSZM_SZN = "Size zone non-uniformity: the sum over zone sizes of the squared number of zones of that size, divided by the number of zones; it is low when zone sizes are spread evenly."
3GLSZM_SZNN = "Size zone non-uniformity normalized: size zone non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
3GLSZM_ZP = "Zone percentage: the number of zones divided by the number of voxels, which is high for fine texture."
3GLSZM_GLV = "Grey level variance: the variance of the grey level over all zones."
3GLSZM_ZV = "Zone variance: the variance of the zone size over all zones."
3GLSZM_ZE = "Zone entropy: the base-2 entropy of the joint distribution of zone grey level and zone size."
3GLSZM_LGLZE = "Low grey level zone emphasis: the mean over all zones of one over the squared grey level, which is high when dark zones dominate."
3GLSZM_HGLZE = "High grey level zone emphasis: the mean over all zones of the squared grey level, which is high when bright zones dominate."
3GLSZM_SALGLE = "Small area low grey level emphasis: the mean over all zones of one over the squared zone size times the squared grey level, which is high for small dark zones."
3GLSZM_SAHGLE = "Small area high grey level emphasis: the mean over all zones of the squared grey level over the squared zone size, which is high for small bright zones."
3GLSZM_LALGLE = "Large area low grey level emphasis: the mean over all zones of the squared zone size over the squared grey level, which is high for large dark zones."
3GLSZM_LAHGLE = "Large area high grey level emphasis: the mean over all zones of the squared zone size times the squared grey level, which is high for large bright zones."

[gldm_3d]
3GLDM_SDE = "Small dependence emphasis: the mean over all voxels of one over the squared dependence, which is high when voxels have few same-level neighbours (heterogeneous texture)."
3GLDM_LDE = "Large dependence emphasis: the mean over all voxels of the squared dependence, which is high when voxels have many same-level neighbours (homogeneous texture)."
3GLDM_GLN = "Grey level non-uniformity: the sum over grey levels of the squared number of voxels at that level, divided by the number of voxels; it is low when the grey levels are evenly represented."
3GLDM_DN = "Dependence non-uniformity: the sum over dependence values of the squared number of voxels with that dependence, divided by the number of voxels; it is low when dependences are spread evenly."
3GLDM_DNN = "Dependence non-uniformity normalized: dependence non-uniformity divided by the number of voxels once more, giving a value between 0 and 1."
3GLDM_GLV = "Grey level variance: the variance of the grey level over the dependence matrix."
3GLDM_DV = "Dependence variance: the variance of the dependence over the dependence matrix."
3GLDM_DE = "Dependence entropy: the base-2 entropy of the joint distribution of grey level and dependence."
3GLDM_LGLE = "Low grey level emphasis: the mean over all voxels of one over the squared grey level, which is high when dark voxels dominate."
3GLDM_HGLE = "High grey level emphasis: the mean over all voxels of the squared grey level, which is high when bright voxels dominate."
3GLDM_SDLGLE = "Small dependence low grey level emphasis: the mean over all voxels of one over the squared dependence times the squared grey level, which is high for dark voxels with few same-level neighbours."
3GLDM_SDHGLE = "Small dependence high grey level emphasis: the mean over all voxels of the squared grey level over the squared dependence, which is high for bright voxels with few same-level neighbours."
3GLDM_LDLGLE = "Large dependence low grey level emphasis: the mean over all voxels of the squared dependence over the squared grey level, which is high for dark voxels with many same-level neighbours."
3GLDM_LDHGLE = "Large dependence high grey level emphasis: the mean over all voxels of the squared dependence times the squared grey level, which is high for bright voxels with many same-level neighbours."

[gldzm_3d]
3GLDZM_SDE = "Small distance emphasis: the mean over all zones of one over the squared zone distance, which is high when zones lie close to the ROI edge."
3GLDZM_LDE = "Large distance emphasis: the mean over all zones of the squared zone distance, which is high when zones lie deep inside the ROI."
3GLDZM_LGLZE = "Low grey level zone emphasis: the mean over all zones of one over the squared grey level, which is high when dark zones dominate."
3GLDZM_HGLZE = "High grey level zone emphasis: the mean over all zones of the squared grey level, which is high when bright zones dominate."
3GLDZM_SDLGLE = "Small distance low grey level emphasis: the mean over all zones of one over the squared zone distance times the squared grey level, which is high for dark zones near the ROI edge."
3GLDZM_SDHGLE = "Small distance high grey level emphasis: the mean over all zones of the squared grey level over the squared zone distance, which is high for bright zones near the ROI edge."
3GLDZM_LDLGLE = "Large distance low grey level emphasis: the mean over all zones of the squared zone distance over the squared grey level, which is high for dark zones deep inside the ROI."
3GLDZM_LDHGLE = "Large distance high grey level emphasis: the mean over all zones of the squared zone distance times the squared grey level, which is high for bright zones deep inside the ROI."
3GLDZM_GLNU = "Grey level non-uniformity: the sum over grey levels of the squared number of zones at that level, divided by the number of zones; it is low when zones are spread evenly over the grey levels."
3GLDZM_GLNUN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
3GLDZM_ZDNU = "Zone distance non-uniformity: the sum over distances of the squared number of zones at that distance, divided by the number of zones; it is low when zone distances are spread evenly."
3GLDZM_ZDNUN = "Zone distance non-uniformity normalized: zone distance non-uniformity divided by the number of zones once more, giving a value between 0 and 1."
3GLDZM_ZP = "Zone percentage: the number of zones divided by the number of ROI voxels, which is high for fine texture."
3GLDZM_GLM = "Grey level mean: the mean grey level over all zones."
3GLDZM_GLV = "Grey level variance: the variance of the grey level over all zones."
3GLDZM_ZDM = "Zone distance mean: the mean zone distance over all zones."
3GLDZM_ZDV = "Zone distance variance: the variance of the zone distance over all zones."
3GLDZM_ZDE = "Zone distance entropy: the base-2 entropy of the joint distribution of zone grey level and zone distance."

[ngldm_3d]
3NGLDM_LDE = "Low dependence emphasis: the mean over all ROI voxels of one over the squared dependence count, which is high when voxels have few same-level neighbours."
3NGLDM_HDE = "High dependence emphasis: the mean over all ROI voxels of the squared dependence count, which is high when voxels have many same-level neighbours."
3NGLDM_LGLCE = "Low grey level count emphasis: the mean over all ROI voxels of one over the squared grey level, which is high when dark voxels dominate."
3NGLDM_HGLCE = "High grey level count emphasis: the mean over all ROI voxels of the squared grey level, which is high when bright voxels dominate."
3NGLDM_LDLGLE = "Low dependence low grey level emphasis: the mean over all ROI voxels of one over the squared dependence count times the squared grey level, which is high for dark voxels with few same-level neighbours."
3NGLDM_LDHGLE = "Low dependence high grey level emphasis: the mean over all ROI voxels of the squared grey level over the squared dependence count, which is high for bright voxels with few same-level neighbours."
3NGLDM_HDLGLE = "High dependence low grey level emphasis: the mean over all ROI voxels of the squared dependence count over the squared grey level, which is high for dark voxels with many same-level neighbours."
3NGLDM_HDHGLE = "High dependence high grey level emphasis: the mean over all ROI voxels of the squared dependence count times the squared grey level, which is high for bright voxels with many same-level neighbours."
3NGLDM_GLNU = "Grey level non-uniformity: the sum over grey levels of the squared number of voxels at that level, divided by the number of voxels; it is low when the grey levels are evenly represented."
3NGLDM_GLNUN = "Grey level non-uniformity normalized: grey level non-uniformity divided by the number of voxels once more, giving a value between 0 and 1."
3NGLDM_DCNU = "Dependence count non-uniformity: the sum over dependence counts of the squared number of voxels with that count, divided by the number of voxels; it is low when dependence counts are spread evenly."
3NGLDM_DCNUN = "Dependence count non-uniformity normalized: dependence count non-uniformity divided by the number of voxels once more, giving a value between 0 and 1."
3NGLDM_DCP = "Dependence count percentage: the fraction of ROI voxels that serve as neighbourhood centres; every ROI voxel is one, so the value is always 1."
3NGLDM_GLM = "Grey level mean: the mean grey level over the dependence matrix."
3NGLDM_GLV = "Grey level variance: the variance of the grey level over the dependence matrix."
3NGLDM_DCM = "Dependence count mean: the mean dependence count over the dependence matrix."
3NGLDM_DCV = "Dependence count variance: the variance of the dependence count over the dependence matrix."
3NGLDM_DCENT = "Dependence count entropy: the base-2 entropy of the joint distribution of grey level and dependence count."
3NGLDM_DCENE = "Dependence count energy: the sum of the squared probabilities of the dependence matrix, which is high when a few combinations of grey level and dependence count dominate."

[ngtdm_3d]
3NGTDM_COARSENESS = "Coarseness: one over the probability-weighted sum of the differences between each grey level and its neighbourhood averages, which is high when intensity changes slowly (large uniform patches)."
3NGTDM_CONTRAST = "Contrast: the spread of the grey levels present multiplied by the mean difference between a voxel and its neighbourhood average, which is high when both the dynamic range and the local variation are large."
3NGTDM_BUSYNESS = "Busyness: the probability-weighted neighbourhood differences divided by the summed differences between probability-weighted grey levels, which is high when intensity changes rapidly from voxel to voxel."
3NGTDM_COMPLEXITY = "Complexity: the grey-level differences between pairs of levels weighted by their neighbourhood differences, which is high when the image has many abrupt intensity changes."
3NGTDM_STRENGTH = "Strength: the probability-weighted squared differences between grey levels divided by the summed neighbourhood differences, which is high when the image has large, distinct regions of different intensity."

[image_quality]
FOCUS_SCORE = "Variance of the Laplacian (3x3 kernel) of the ROI's bounding box; higher values mean a sharper image."
LOCAL_FOCUS_SCORE = "Mean of FOCUS_SCORE over a 2x2 grid of equal, non-overlapping tiles of the bounding box."
POWER_SPECTRUM_SLOPE = "Slope of a straight-line fit of log power against log bin index, computed from the image's Fourier transform with each coefficient binned by its own magnitude rather than by its frequency; 0 when the bounding box's shorter side is under 24 pixels."
MAX_SATURATION = "Fraction of bounding-box pixels at the maximum grey level, from 0 to 1."
MIN_SATURATION = "Fraction of bounding-box pixels at the minimum grey level, from 0 to 1; pixels outside the ROI count as 0."
SHARPNESS = "Edge sharpness from the difference of medians of a 3x3 median-filtered image, combined over the horizontal and vertical directions."
