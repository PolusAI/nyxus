# Per-feature facts for the family definition pages that are not in the code: a short name, the
# IBSI identifier, and the value on the page's worked example. docs/tools/gen_feature_reference.py
# renders them, with each feature's validation from tests/vetting/oracle_coverage.csv, into the
# page's feature index; the page's example script asserts every `example` value.
#
# Codes are the family's base codes; the _AVE codes are described with the output columns.

